# Default application configuration (safe, demo-first).
# Environment variables (MT5_AGENT_*) always override these values.
# Secrets must NEVER be stored here — use .env / environment only.
app_name: llm-mt5-agent
env: development
log_level: INFO
log_format: json

trading_mode: dry_run
enable_live_trading: false

mt5_timeout_ms: 60000
mt5_portable: false
mt5_default_symbol: EURUSD
mt5_default_timeframe: M1
mt5_default_candles: 100
# mt5_path: "C:/Program Files/MetaTrader 5/terminal64.exe"
# mt5_login: null
# mt5_server: null

llm_provider: none
# llm_model: null
# llm_base_url: null  # override for proxies / self-hosted gateways
llm_timeout_s: 30.0
# llm_api_key must come from MT5_AGENT_LLM_API_KEY env var, never this file.

# Deterministic risk limits (the LLM can never override these).
risk_max_risk_pct: 1.0
risk_max_daily_loss_pct: 3.0
risk_max_positions: 3
risk_max_exposure: 1.0
# risk_allowed_symbols: "EURUSD,XAUUSD"  # null = all symbols allowed
risk_allowed_sessions: "0-24"
# risk_max_spread_points: null
risk_require_stop_loss: true
risk_require_take_profit: true
risk_min_stop_points: 0.0
risk_duplicate_window_s: 600.0
risk_cooldown_s: 60.0
risk_min_margin_level_pct: 100.0
